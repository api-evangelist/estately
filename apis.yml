name: Estately
description: Estately is a Seattle-based, MLS-based residential real estate search platform for browsing
  homes for sale, recently sold homes, home values, and neighborhood information, and for connecting buyers
  and sellers with agents. Estately does not publish a public developer API or developer portal; its notable
  developer-facing surface is the open-source `rets` Ruby library it maintains for fetching data from RETS
  (Real Estate Transaction Standard) servers, distributed on RubyGems with a bundled command-line client.
  This profile was surfaced from VC-portfolio signals (500 Global, Uncork Capital) and enriched by the API
  Evangelist pipeline.
